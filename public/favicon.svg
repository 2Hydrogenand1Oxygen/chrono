<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141722"/>
      <stop offset="100%" stop-color="#090B10"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#91AFFF"/>
      <stop offset="100%" stop-color="#557FEA"/>
    </linearGradient>
    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Squircle Base Container -->
  <rect x="16" y="16" width="480" height="480" rx="120" ry="120" fill="url(#bgGrad)" stroke="rgba(255, 255, 255, 0.08)" stroke-width="4"/>

  <!-- Outer Dial Track -->
  <circle cx="256" cy="256" r="160" fill="none" stroke="rgba(255, 255, 255, 0.12)" stroke-width="14"/>

  <!-- Accent Progress Arc -->
  <path d="M 256 96 A 160 160 0 0 1 394.5 336" fill="none" stroke="url(#accentGrad)" stroke-width="16" stroke-linecap="round" filter="url(#subtleGlow)"/>

  <!-- Hour markers -->
  <circle cx="256" cy="120" r="5" fill="rgba(255, 255, 255, 0.4)"/>
  <circle cx="392" cy="256" r="5" fill="rgba(255, 255, 255, 0.4)"/>
  <circle cx="256" cy="392" r="5" fill="rgba(255, 255, 255, 0.4)"/>
  <circle cx="120" cy="256" r="5" fill="rgba(255, 255, 255, 0.4)"/>

  <!-- Clock Hands -->
  <!-- Minute hand -->
  <line x1="256" y1="256" x2="330" y2="155" stroke="url(#accentGrad)" stroke-width="16" stroke-linecap="round"/>
  <!-- Hour hand -->
  <line x1="256" y1="256" x2="185" y2="215" stroke="#F5F7FC" stroke-width="18" stroke-linecap="round"/>

  <!-- Center Hub Pin -->
  <circle cx="256" cy="256" r="18" fill="#F5F7FC"/>
  <circle cx="256" cy="256" r="8" fill="#557FEA"/>
</svg>
